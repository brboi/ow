[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-workspaces"
description = "Ready-to-code Odoo workspaces on git worktrees"
authors = [{ name = "Bruno BOI", email = "boi@odoo.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.26", "click>=8.5.0", "tomli-w>=1.0", "pluggy>=1.5"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/brboi/ow"
Repository = "https://github.com/brboi/ow"


[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ow = "ow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ow*"]

[tool.setuptools_scm]
write_to = "src/ow/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
