name: Test

on:
  # Branches are tested through their pull request; main is tested on push.
  push:
    branches: [main]
  pull_request:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.x']
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest
      - name: Run tests
        run: python -m pytest -q src/tests

  test-alpine:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
    
    steps:
      # git must exist before checkout: without it, actions/checkout downloads a tarball
      # with no .git, and setuptools-scm cannot compute the version.
      - name: Install dependencies
        run: |
          apk add --no-cache git=2.45.4-r0 python3 py3-pip py3-virtualenv bash
      - name: Verify git version
        run: |
          git --version | grep "git version 2.45.4"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The container runs as root over a checkout owned by the runner user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create venv and install
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -e .
          pip install pytest
      - name: Run tests
        run: |
          . venv/bin/activate
          python -m pytest -q src/tests
