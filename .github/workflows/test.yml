name: Test

on:
  # Branches are tested through their pull request; main is tested on push.
  push:
    branches: [main]
  pull_request:
  # The release workflow gates publication on this one.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: pyproject.toml

  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The runner's git is far newer than the declared floor, so the floor is built from
      # source here too (same recipe as the alpine job).
      - name: Install git build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl libcurl4-openssl-dev \
            zlib1g-dev libssl-dev libexpat1-dev
      - name: Build git 2.45.4 (the declared floor)
        run: |
          curl -fsSL https://www.kernel.org/pub/software/scm/git/git-2.45.4.tar.gz -o /tmp/git.tar.gz
          tar -C /tmp -xzf /tmp/git.tar.gz
          # git 2.45 predates C23, which GCC 15 defaults to (its `unreachable` macro clashes).
          make -C /tmp/git-2.45.4 -j4 prefix=/usr/local NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 \
            NO_REGEX=NeedsStartEnd CFLAGS='-O2 -std=gnu17' install
      - name: Verify git 2.45.4 wins on PATH
        run: |
          command -v git
          test "$(command -v git)" = "/usr/local/bin/git"
          test "$(git --version)" = "git version 2.45.4"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q src/tests

  test-alpine:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    steps:
      # git must exist before checkout: without it, actions/checkout downloads a tarball
      # with no .git, and setuptools-scm cannot compute the version.
      # Every supported alpine (3.21+) ships git newer than the declared floor, so the
      # floor is built from source here instead of pinning an EOL image.
      - name: Install dependencies
        run: |
          apk add --no-cache git python3 py3-pip py3-virtualenv bash zsh fish \
            build-base curl curl-dev zlib-dev openssl-dev expat-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The container runs as root over a checkout owned by the runner user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build git 2.45.4 (the declared floor)
        run: |
          curl -fsSL https://www.kernel.org/pub/software/scm/git/git-2.45.4.tar.gz -o /tmp/git.tar.gz
          tar -C /tmp -xzf /tmp/git.tar.gz
          make -C /tmp/git-2.45.4 -j4 prefix=/usr/local NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 \
            NO_REGEX=NeedsStartEnd install
      - name: Verify git 2.45.4 wins on PATH
        run: |
          command -v git
          test "$(command -v git)" = "/usr/local/bin/git"
          test "$(git --version)" = "git version 2.45.4"
      - name: Create venv and install
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          . venv/bin/activate
          python -m pytest -q src/tests
